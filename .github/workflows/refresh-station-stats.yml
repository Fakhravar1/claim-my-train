name: Refresh station stats

# MONTHLY regeneration of src/content/stationStats.json + operatorStats.json
# (the data snapshots behind the /forseningar SEO pages) from
# dbt_dev.agg_station_delays_daily / agg_operator_delays_daily. Each run
# publishes the PREVIOUS CALENDAR MONTH.
#
# Why monthly, not daily (changed 2026-08-10): these pages are static, built at
# `vite build` time, and reaching production requires a MANUAL "Publish" click
# in Lovable — Lovable has no autopublish and exposes no API to trigger one. A
# daily cron therefore wrote stats that sat unpublished until a human
# remembered; production was measured 3 days stale on 2026-08-10. Monthly makes
# the manual step liveable (12 clicks/year instead of 365) and a named month
# ("juli 2026") is better, more citable content than a rolling window.
#
# ⚠️ The trade: a MISSED publish now costs a month, not a day. The
# check-unpublished-content job in this workflow is what stops that being
# silent — do not remove it without replacing the signal.
#
# The commit is pushed with GITHUB_TOKEN, and pushes made by Actions do NOT
# trigger other workflows — so the mirror-to-lovable workflow won't fire.
# The mirror push to the companion repo is therefore replicated inline below.

on:
  schedule:
    # 04:30 UTC on the 2nd of each month. The 2nd, not the 1st: dbt and the
    # Trafikverket feed need a night to settle the final day of the month.
    - cron: "30 4 2 * *"
  workflow_dispatch:

jobs:
  refresh:
    # Working repo only — the mirror copies workflow files to the companion,
    # which has no secrets and must never run this.
    if: github.repository == 'Fakhravar1/claim-my-train'
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-station-stats
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the mirror push needs the same ancestry
          persist-credentials: false # push via explicit token URLs below

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psycopg2-binary pyyaml

      - name: Regenerate stationStats.json
        env:
          # Same session-pooler secrets the dbt-run workflow uses (port 5432).
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        run: python scripts/refresh_station_stats.py

      - name: Commit and push if changed
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet src/content/stationStats.json src/content/operatorStats.json; then
            echo "stationStats.json + operatorStats.json unchanged — nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/stationStats.json src/content/operatorStats.json
          git commit -m "Refresh station + operator delay stats snapshot (daily cron)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Mirror to Lovable companion
        if: steps.commit.outputs.pushed == 'true'
        env:
          PAT: ${{ secrets.LOVABLE_MIRROR_PAT }}
        run: |
          if [ -z "${PAT}" ]; then
            echo "::error::LOVABLE_MIRROR_PAT secret is not set. See CLAUDE.md §11."
            exit 1
          fi
          git push "https://x-access-token:${PAT}@github.com/Fakhravar1/claim-my-train-ab5b0f74.git" HEAD:main
    permissions:
      contents: write
