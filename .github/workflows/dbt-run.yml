name: dbt run

on:
  # Scheduling is EXTERNAL: pg_cron inside Supabase (`dispatch-dbt-run-hourly`,
  # jobid 18, hourly) POSTs the `dispatch-workflow` edge function, which fires
  # this workflow via the GitHub workflow_dispatch API. cron-jobs.org was retired
  # for dbt on 2026-07-29. The in-repo `schedule:` was removed on purpose — do
  # NOT re-add it, or the job double-fires (external cron + GitHub both trigger).
  workflow_dispatch:          # external cron + manual "Run workflow" button
    inputs:
      runner:
        description: Runner to execute on
        type: choice
        options: [ubuntu-latest]
        # The `dispatch-workflow` edge function owns this trigger and always
        # passes an explicit `runner`. The input is KEPT even though there is
        # only one choice left: GitHub rejects a dispatch whose inputs don't
        # match the workflow's declared ones, so dropping it would break the
        # dispatcher. The default applies only to a human clicking "Run
        # workflow", or to a re-run.
        #
        # The Raspberry Pi (`qvitta-pi`) was DECOMMISSIONED 2026-10-11 and
        # removed from the options, because the old `default: qvitta-pi` was a
        # live trap once the machine was gone: a job aimed at an offline
        # self-hosted runner does not fail, it queues SILENTLY for up to 24 h
        # and is then cancelled. The router protected the scheduled path from
        # that, but never a manual dispatch.
        #
        # ⚠️ IF A SELF-HOSTED RUNNER EVER COMES BACK, re-add its label to
        # `options` BEFORE pointing the router at it. GitHub validates a
        # choice input against this list, so a dispatch carrying a label that
        # isn't here is rejected with a 400 and no run starts — the scheduled
        # build would stop. That failure is at least loud (the 400 lands in
        # net._http_response, and check-data-freshness re-dispatches on
        # ubuntu-latest within its 6 h threshold), but it is still an outage.
        default: ubuntu-latest

jobs:
  run:
    # Belt-and-suspenders: this file gets mirrored to the Lovable companion
    # repo (Fakhravar1/claim-my-train-ab5b0f74). The companion has no Supabase
    # secrets and isn't supposed to run dbt anyway. Repo guard ensures the job
    # only executes on the working repo, even if someone re-enables the
    # workflow on the companion or fires it via workflow_dispatch there.
    if: github.repository == 'Fakhravar1/claim-my-train'
    # `inputs` IS available in the runs-on context. The `|| 'ubuntu-latest'`
    # fallback covers non-dispatch events (there are none today — the in-repo
    # `schedule:` was removed on purpose and must not come back) and any caller
    # that omits the input. It must stay a HOSTED runner: see the decommission
    # note on the `runner` input above.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    concurrency:
      group: dbt-run          # prevents overlapping runs if one is slow
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 because `ubuntu-latest` provides it. (The original reason was
          # that Ubuntu 24.04 on the Pi shipped 3.12 and not 3.11, so one file
          # could serve both runners without branching on runner.environment —
          # moot since the Pi was decommissioned 2026-10-11, but 3.12 is still
          # the right pin and there is no reason to churn it.)
          python-version: '3.12'
          # Persist pip's wheel-download cache across the ~24 scheduled runs/day
          # so re-installing dbt each run skips the downloads. Keyed on the CI
          # requirements file below (the version pins never change between runs).
          cache: pip
          cache-dependency-path: .github/requirements/dbt.txt

      - name: Install dbt
        # Pins + rationale live in .github/requirements/dbt.txt (Fusion-alpha cap).
        run: pip install -r .github/requirements/dbt.txt

      - name: Configure profile
        env:
          PG_HOST:     ${{ secrets.SUPABASE_DB_HOST }}
          PG_PORT:     ${{ secrets.SUPABASE_DB_PORT }}
          PG_USER:     ${{ secrets.SUPABASE_DB_USER }}
          PG_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PG_DBNAME:   ${{ secrets.SUPABASE_DB_NAME }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'YAML'
          trafiklab:
            outputs:
              dev:
                type: postgres
                host:     "{{ env_var('PG_HOST') }}"
                port:     "{{ env_var('PG_PORT') | int }}"
                user:     "{{ env_var('PG_USER') }}"
                password: "{{ env_var('PG_PASSWORD') }}"
                dbname:   "{{ env_var('PG_DBNAME') }}"
                schema:   dbt_dev
                threads:  2
                sslmode:  require
            target: dev
          YAML

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt build
        working-directory: dbt
        env:
          PG_HOST:     ${{ secrets.SUPABASE_DB_HOST }}
          PG_PORT:     ${{ secrets.SUPABASE_DB_PORT }}
          PG_USER:     ${{ secrets.SUPABASE_DB_USER }}
          PG_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PG_DBNAME:   ${{ secrets.SUPABASE_DB_NAME }}
        run: dbt build
        # Failure alerting: notify-claude-on-failure.yml (workflow_run catch-all)
        # pings the Claude investigator when this workflow fails — the inline
        # if:failure() step that briefly lived here was superseded by it.
