name: dbt run

on:
  # Scheduling is EXTERNAL since 2026-07-01: cron-jobs.org fires this workflow every
  # 15 min via the GitHub workflow_dispatch API (reliable cadence, no free-tier
  # `schedule:` jitter). The in-repo `schedule:` was removed on purpose — do NOT
  # re-add it, or the job double-fires (cron-jobs.org + GitHub both trigger).
  workflow_dispatch:          # external cron + manual "Run workflow" button

jobs:
  run:
    # Belt-and-suspenders: this file gets mirrored to the Lovable companion
    # repo (Fakhravar1/claim-my-train-ab5b0f74). The companion has no Supabase
    # secrets and isn't supposed to run dbt anyway. Repo guard ensures the job
    # only executes on the working repo, even if someone re-enables the
    # workflow on the companion or fires it via workflow_dispatch there.
    if: github.repository == 'Fakhravar1/claim-my-train'
    runs-on: ubuntu-latest
    concurrency:
      group: dbt-run          # prevents overlapping runs if one is slow
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Persist pip's wheel-download cache across the ~96 scheduled runs/day
          # so re-installing dbt each run skips the downloads. Keyed on the CI
          # requirements file below (the version pins never change between runs).
          cache: pip
          cache-dependency-path: .github/requirements/dbt.txt

      - name: Install dbt
        # Pins + rationale live in .github/requirements/dbt.txt (Fusion-alpha cap).
        run: pip install -r .github/requirements/dbt.txt

      - name: Configure profile
        env:
          PG_HOST:     ${{ secrets.SUPABASE_DB_HOST }}
          PG_PORT:     ${{ secrets.SUPABASE_DB_PORT }}
          PG_USER:     ${{ secrets.SUPABASE_DB_USER }}
          PG_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PG_DBNAME:   ${{ secrets.SUPABASE_DB_NAME }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'YAML'
          trafiklab:
            outputs:
              dev:
                type: postgres
                host:     "{{ env_var('PG_HOST') }}"
                port:     "{{ env_var('PG_PORT') | int }}"
                user:     "{{ env_var('PG_USER') }}"
                password: "{{ env_var('PG_PASSWORD') }}"
                dbname:   "{{ env_var('PG_DBNAME') }}"
                schema:   dbt_dev
                threads:  2
                sslmode:  require
            target: dev
          YAML

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt build
        working-directory: dbt
        env:
          PG_HOST:     ${{ secrets.SUPABASE_DB_HOST }}
          PG_PORT:     ${{ secrets.SUPABASE_DB_PORT }}
          PG_USER:     ${{ secrets.SUPABASE_DB_USER }}
          PG_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PG_DBNAME:   ${{ secrets.SUPABASE_DB_NAME }}
        run: dbt build
        # Failure alerting: notify-claude-on-failure.yml (workflow_run catch-all)
        # pings the Claude investigator when this workflow fails — the inline
        # if:failure() step that briefly lived here was superseded by it.
