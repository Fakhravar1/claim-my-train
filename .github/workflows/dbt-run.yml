name: dbt run

on:
  # Scheduling is EXTERNAL since 2026-07-01: cron-jobs.org fires this workflow every
  # 15 min via the GitHub workflow_dispatch API (reliable cadence, no free-tier
  # `schedule:` jitter). The in-repo `schedule:` was removed on purpose — do NOT
  # re-add it, or the job double-fires (cron-jobs.org + GitHub both trigger).
  workflow_dispatch:          # external cron + manual "Run workflow" button

jobs:
  run:
    # Belt-and-suspenders: this file gets mirrored to the Lovable companion
    # repo (Fakhravar1/claim-my-train-ab5b0f74). The companion has no Supabase
    # secrets and isn't supposed to run dbt anyway. Repo guard ensures the job
    # only executes on the working repo, even if someone re-enables the
    # workflow on the companion or fires it via workflow_dispatch there.
    if: github.repository == 'Fakhravar1/claim-my-train'
    runs-on: ubuntu-latest
    concurrency:
      group: dbt-run          # prevents overlapping runs if one is slow
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Persist pip's wheel-download cache across the ~96 scheduled runs/day
          # so re-installing dbt each run skips the downloads. Keyed on the CI
          # requirements file below (the version pins never change between runs).
          cache: pip
          cache-dependency-path: .github/requirements/dbt.txt

      - name: Install dbt
        # Pins + rationale live in .github/requirements/dbt.txt (Fusion-alpha cap).
        run: pip install -r .github/requirements/dbt.txt

      - name: Configure profile
        env:
          PG_HOST:     ${{ secrets.SUPABASE_DB_HOST }}
          PG_PORT:     ${{ secrets.SUPABASE_DB_PORT }}
          PG_USER:     ${{ secrets.SUPABASE_DB_USER }}
          PG_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PG_DBNAME:   ${{ secrets.SUPABASE_DB_NAME }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'YAML'
          trafiklab:
            outputs:
              dev:
                type: postgres
                host:     "{{ env_var('PG_HOST') }}"
                port:     "{{ env_var('PG_PORT') | int }}"
                user:     "{{ env_var('PG_USER') }}"
                password: "{{ env_var('PG_PASSWORD') }}"
                dbname:   "{{ env_var('PG_DBNAME') }}"
                schema:   dbt_dev
                threads:  2
                sslmode:  require
            target: dev
          YAML

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt build
        working-directory: dbt
        env:
          PG_HOST:     ${{ secrets.SUPABASE_DB_HOST }}
          PG_PORT:     ${{ secrets.SUPABASE_DB_PORT }}
          PG_USER:     ${{ secrets.SUPABASE_DB_USER }}
          PG_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PG_DBNAME:   ${{ secrets.SUPABASE_DB_NAME }}
        run: dbt build

      # On failure, wake the Claude investigator routine via the service-bearer-
      # gated fire-claude-investigator edge function (debounced server-side to
      # once per 6 h, so an hourly-failing build wakes ONE agent per incident).
      # Why this matters: a failing dbt test SKIPs every downstream mart, so
      # public.v_journeys / v_claimable_journeys stop refreshing while CI is red
      # — and the data-freshness watchdog can't see that (raw + int_stop_events
      # stay fresh), so without this ping nobody is alerted.
      - name: Ping Claude investigator on failure
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets missing — cannot ping the Claude investigator."
            exit 0
          fi
          payload=$(jq -n --arg run_url "$RUN_URL" '{
            key: "gh:dbt-run",
            text: ("CI FAILURE EVENT — this poke comes from GitHub Actions, NOT the freshness watchdog; if check_data_freshness() shows nothing breached, do NOT stop — the failure is in CI itself. The dbt-run workflow FAILED on Fakhravar1/claim-my-train: " + $run_url + " . Pull the failed run logs and diagnose. Common cause: a dbt data test failed — note a failing test on int_stop_events SKIPs all downstream marts, so public.v_journeys / v_claimable_journeys stop refreshing while CI stays red. The safety rules from the routine prompt still apply: no destructive SQL, no dbt --full-refresh, no schema changes; fix only if clearly safe, otherwise report. Email the diagnosis/result to arianfakhravar@gmail.com as usual.")
          }')
          curl -sS --max-time 30 -X POST "$SUPABASE_URL/functions/v1/fire-claude-investigator" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            || echo "::warning::Claude investigator ping failed (non-fatal)"
