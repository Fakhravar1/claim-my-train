name: Claim PDF worker

on:
  schedule:
    - cron: "0 6 * * *"      # daily 06:00 UTC (GH jitter is fine here)
  workflow_dispatch: {}        # manual "Run workflow" button

jobs:
  generate-pdfs:
    runs-on: ubuntu-latest
    # Don't run on the mirrored Lovable companion repo — it has no secrets.
    if: github.repository == 'Fakhravar1/claim-my-train'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r claim-worker/requirements.txt
      - run: python claim-worker/worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
