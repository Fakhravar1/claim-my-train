name: Claim PDF worker

on:
  schedule:
    # Every 15 min so a filed claim is submitted within ~one cron cycle instead of next day.
    # NB: GitHub free-tier scheduled actions are best-effort — real cadence is often 15 min–1 h
    # of jitter (same as dbt-run.yml). The worker no-ops fast when there are no pending claims.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}        # manual "Run workflow" button

jobs:
  generate-pdfs:
    runs-on: ubuntu-latest
    # Don't run on the mirrored Lovable companion repo — it has no secrets.
    if: github.repository == 'Fakhravar1/claim-my-train'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r claim-worker/requirements.txt
      # Chromium for the SJ web-form path (submit_sj.py). Cheap relative to the daily
      # cadence; the SJ branch only launches a browser when an SJ claim is present.
      - run: python -m playwright install --with-deps chromium
      - run: python claim-worker/worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Hard off-switch for real SJ submissions. LIVE since 2026-06-30 (vars.SJ_SUBMIT_LIVE
          # = true): an SJ 'pending' claim is submitted on the next run — the SjClaimModal +
          # sj-lookup are the human/validation gate (worker.py handle_sj). Set to false to
          # revert to dry-run screenshots.
          SJ_SUBMIT_LIVE: ${{ vars.SJ_SUBMIT_LIVE }}
          # Same hard off-switch for Vy's headless web form (submit_vy.py). Leave unset until
          # the station-dropdown mapping is tuned against a real booking; dry-run only.
          VY_SUBMIT_LIVE: ${{ vars.VY_SUBMIT_LIVE }}
