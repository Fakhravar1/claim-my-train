name: Claim PDF worker

on:
  schedule:
    # Every 15 min so a filed claim is submitted within ~one cron cycle instead of next day.
    # NB: GitHub free-tier scheduled actions are best-effort — real cadence is often 15 min–1 h
    # of jitter (same as dbt-run.yml). The worker no-ops fast when there are no pending claims.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}        # manual "Run workflow" button

jobs:
  generate-pdfs:
    runs-on: ubuntu-latest
    # Fail fast if a runner stalls. A real run is ~12s (no-op preflight) to ~2 min
    # (claim + Chromium install); without this cap a stuck runner burns up to the
    # 360-min default before GitHub kills it (run 360 hung ~15 min on a no-op run,
    # 2026-07-24). 10 min is a safe ceiling well above the worst legitimate run.
    timeout-minutes: 10
    # Don't run on the mirrored Lovable companion repo — it has no secrets.
    if: github.repository == 'Fakhravar1/claim-my-train'
    steps:
      - uses: actions/checkout@v4

      # Cheap preflight: most runs have nothing to do, yet the old flow paid for a
      # full Python + Chromium install every time. Query the claims table once and
      # only install what this run actually needs.
      #   count   > 0  -> Python + worker (PDF path needs no browser)
      #   browser > 0  -> also install Chromium (SJ/Vy/HLT/Kalmar web-form paths)
      # Fail-safe: if the query errors, force both nonzero so we never silently skip
      # real claims — we'd rather pay for one wasted run than drop a filing.
      - name: Preflight — any claims to process?
        id: claims
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          statuses="pending,sj_authorized,hlt_authorized,kalmar_authorized,vy_authorized"
          resp=$(curl -sS --max-time 25 \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/claims?select=status,purchasing_operator&status=in.(${statuses})") || resp=""
          if ! echo "$resp" | jq -e 'type=="array"' >/dev/null 2>&1; then
            echo "Preflight query failed; running the full worker to be safe."
            { echo "count=1"; echo "browser=1"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(echo "$resp" | jq 'length')
          # Browser needed if any claim is an *_authorized review, or a pending row
          # whose operator files via a headless web form (SJ/Vy/HLT/Kalmar). The
          # Skanetrafiken/Oresundstag/NULL PDF path uses reportlab — no browser.
          browser=$(echo "$resp" | jq '[.[] | select(
              (.status | endswith("_authorized")) or
              ((.purchasing_operator // "" | ascii_downcase) | IN("sj","vy","hallandstrafiken","kalmar"))
            )] | length')
          { echo "count=$count"; echo "browser=$browser"; } >> "$GITHUB_OUTPUT"
          echo "Pending claims: $count (browser-needing: $browser)"

      - uses: actions/setup-python@v5
        if: steps.claims.outputs.count != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: claim-worker/requirements.txt

      - name: Install Python deps
        if: steps.claims.outputs.count != '0'
        run: pip install -r claim-worker/requirements.txt

      # Chromium only for the headless web-form paths — skipped on the common
      # PDF-only / nothing-to-do runs, which is where the minutes were going.
      - name: Install Chromium
        if: steps.claims.outputs.browser != '0'
        run: python -m playwright install --with-deps chromium

      - name: Run worker
        if: steps.claims.outputs.count != '0'
        run: python claim-worker/worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Hard off-switch for real SJ submissions. LIVE since 2026-06-30 (vars.SJ_SUBMIT_LIVE
          # = true): an SJ 'pending' claim is submitted on the next run — the SjClaimModal +
          # sj-lookup are the human/validation gate (worker.py handle_sj). Set to false to
          # revert to dry-run screenshots.
          SJ_SUBMIT_LIVE: ${{ vars.SJ_SUBMIT_LIVE }}
          # Same hard off-switch for Vy's headless web form (submit_vy.py). Leave unset until
          # the station-dropdown mapping is tuned against a real booking; dry-run only.
          VY_SUBMIT_LIVE: ${{ vars.VY_SUBMIT_LIVE }}
