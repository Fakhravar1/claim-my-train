version: 2

sources:
- name: raw 
  schema: public
  description: "Raw data from the source system, api from trafiklab" 
  tables:
  - name: raw_departures
    description: "Departures from the source system, api from trafiklab"
    columns:
    - name: id
      description: "Unique identifier for the departure event"
    - name: scheduled
    - name: realtime 
    - name: arrival_delay 
    - name: canceled 
    - name: is_realtime 
    - name: route__name 
    - name: route__designation 
    - name: route__transport_mode_code 
    - name: route__transport_mode 
    - name: route__direction 
    - name: route__origin__id 
    - name: route__origin__name 
    - name: route__destination__id 
    - name: route__destination__name 
    - name: trip__trip_id
    - name: trip__start_date
    - name: trip__technical_number 
    - name: agency__id 
    - name: agency__name 
    - name: agency__operator 
    - name: stop__id 
    - name: stop__name 
    - name: stop__lat 
    - name: stop__lon 
    - name: scheduled_platform__id 
    - name: scheduled_platform__designation 
    - name: realtime_platform__id 
    - name: realtime_platform__designation 
    - name: alerts 
    - name: ingested_at
    # - name: UNIQUE ( trip__start_date, stop__id, scheduled, ingested_at)
  - name: raw_train_announcements
    description: "Trafikverket TrainAnnouncement rows (station-event grain), ingested by collect-train-announcements"
    columns:
    - name: activity_id
      description: "Stable per-announcement id; upsert key"
    - name: advertised_train_ident
    - name: location_signature
    - name: activity_type
    - name: scheduled_time
    - name: estimated_time
    - name: actual_time
    - name: canceled
    - name: deleted
    - name: operator
    - name: train_owner
    - name: information_owner
    - name: from_location
    - name: to_location
    - name: via_from_location
    - name: track_at_location
    - name: modified_time
    - name: ingested_at
- name: reference
  schema: public
  description: "Reference / crosswalk tables — built out-of-band (edge functions), not dbt-managed"
  tables:
  - name: ref_stations
    description: "Trafikverket <-> REST station crosswalk, built by the build-ref-stations edge function (§15)"
    columns:
    - name: tv_signature
      description: "Trafikverket LocationSignature (PK)"
    - name: rest_area_id
      description: "REST/ResRobot 740... area id; numeric tail = REST short stop__id"
    - name: station_name
    - name: rest_name
    - name: resolved
    - name: name_match
    - name: match_distance_m
    

