version: 2

models:
  - name: fct_claimable_journeys
    description: >
        Durable claim-retention layer: one row per claimable journey (destination 20+
        min late or cancelled), captured from fct_journeys and KEPT 60 DAYS (pre_hook
        prune) regardless of upstream raw pruning — the set a user may still file on.
        Incremental delete+insert on journey_key, 6h lookback. NEVER --full-refresh
        once it holds rows older than the raw horizon (collapses retention, see model
        header). NOT the same as public.claims (filed claims).
    columns:
        - name: journey_key
          description: Surrogate key; hash of (service_number, origin_local_date, origin_stop, destination_stop). Matches fct_journeys.
          data_tests:
            - not_null
            - unique
    data_tests:
        - dbt_utils.unique_combination_of_columns:
            arguments:
              combination_of_columns:
                - service_number
                - origin_local_date
                - origin_stop_id
                - destination_stop_id

  - name: fct_journeys
    description: >
        THE unified journey fact the frontend reads (via public.v_journeys). Pairs
        int_stop_events (TV Swedish stops + REST Danish stops) into O-D journeys:
        an origin DEPARTURE joined to a later ARRIVAL of the same service_number
        within a 12h window (handles cross-midnight; excludes next-day recurrence).
        Mode-agnostic column contract (service_number, transport_mode, line_name);
        trains only for now. origin_source/destination_source say which feed supplied
        each leg. Destination delay drives is_claimable (the 20-min/cancel FLOOR).
    columns:
        - name: journey_key
          description: Surrogate key; hash of (service_number, origin_local_date, origin_stop, destination_stop).
          data_tests:
            - not_null
            - unique
        - name: is_claimable
          description: >
              FLOOR flag for display + retention only — NOT the per-operator rule. True when the
              destination clears the most lenient regime across dim_compensation_rules (today the
              20-min/cancel floor): destination_delay_seconds >= min(min_delay_seconds) OR cancelled.
              Keeps v_claimable_journeys a safe superset. The BINDING per-user eligibility (does this
              journey clear the threshold for the user's attested operator, at what tier %) is resolved
              lazily by public.claim_eligibility(delay_seconds, canceled, route_distance_km, operator).
          data_tests: [not_null]
        - name: route_distance_km
          description: >
              Great-circle O-D distance (km) x ~1.2 detour factor, approximating rail distance.
              Picks the legal regime: <150 km = Swedish regional, >=150 km = EU 2021/782. APPROXIMATE
              near the 150 km edge (straight-line underestimates track length) — only band-straddling
              routes can be misclassified. NULL when an endpoint lacks coords (claim_eligibility then
              defaults the unknown distance to the conservative long-distance band). Coords from
              dim_station_coords (REST Danish + ref_stations Swedish).
        - name: destination_delay_seconds
          description: >
              Signed deviation (realtime - scheduled, in seconds) of whichever event the
              feed returns for the DESTINATION stop — an arrival for most legs, but the
              value is the endpoint event's deviation, NOT strictly an arrival measurement.
              Negative = early. NULL when the destination event is unrealised. Drives
              is_claimable against the authority's min_delay_seconds.
        - name: origin_stop_id
          description: Text station id; must resolve to a station carried in dim_active_stations.
          data_tests:
            - not_null
            # Every journey endpoint must be a known active station. Guards the
            # crosswalk chain end-to-end: a station that produced a journey but
            # vanished from dim_active_stations (naming/derivation drift) fails here.
            - relationships:
                arguments:
                  to: ref('dim_active_stations')
                  field: stop__id
        - name: destination_stop_id
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('dim_active_stations')
                  field: stop__id
    data_tests:
        - dbt_utils.unique_combination_of_columns:
            arguments:
              combination_of_columns:
                - service_number
                - origin_local_date
                - origin_stop_id
                - destination_stop_id

  - name: agg_corridor_delays_daily
    description: >
        Corridor-scouting daily aggregate (NOT a claim model). One row per
        (hub, direction, counterpart, operator, service_date): daily delay counts for
        trains seen at a monitored hub (Cst, Mc), read straight off stg_train_announcements.
        Accumulates past the 14 d raw prune (§13 pattern); the rollup agg_corridor_delays
        ranks corridors worst-first. NEVER --full-refresh expecting long history back.
    columns:
        - name: corridor_day_key
          description: Surrogate key; hash of (hub, direction, counterpart, operator, service_date).
          data_tests:
            - not_null
            - unique
    data_tests:
        - dbt_utils.unique_combination_of_columns:
            arguments:
              combination_of_columns:
                - hub_signature
                - direction
                - counterpart_signature
                - operator
                - service_date