version: 2

models:
  - name: fct_departures
    description: "Stop-event grain. One row per (trip, start_date, stop_id) — represents a confirmed train arrival/departure observation."
    columns:
      - name: departure_key
        description: "Surrogate key. MD5 hash of (trip_id, start_date, stop_id)."
        tests:
          - unique
          - not_null
      - name: trip__trip_id
        tests:
          - not_null
      - name: stop__id
        tests:
          - not_null
      - name: arrival_delay
        description: "Delay in seconds vs scheduled arrival. Positive = late."
    tests:                                             # ← back at model level (same indent as `columns:`)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - trip__trip_id
            - trip__start_date
            - stop_sequence
  - name: fct_passenger_journeys
    description: >
      DEPRECATED (2026-06-11): the frontend now reads fct_journeys via public.v_journeys.
      Kept in the DAG for rollback only; delete in a later cleanup.
      Journey-grain fact. One row per (trip, start_date, origin_stop, destination_stop).
      Built from fct_departures by self-joining departure events to later arrival events
      on the same trip.

    columns:
      - name: journey_key
        description: Surrogate key. Hash of trip_id + start_date + origin_stop + destination_stop.
        tests:
          - unique
          - not_null

      - name: trip__trip_id
        tests: [not_null]

      - name: trip__start_date
        tests: [not_null]

      - name: origin_stop_id
        tests: [not_null]

      - name: destination_stop_id
        tests: [not_null]

      - name: is_claimable
        description: True if destination delay >= 20 min OR train was cancelled.
        tests: [not_null]

      - name: origin_local_date
        description: >
          Calendar day on which the origin departure physically runs, in Stockholm local
          time. Distinct from trip__start_date (GTFS service date) for post-midnight trips —
          this is the column the frontend filters on when the user picks a date.
        tests: [not_null]

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - trip__trip_id
            - trip__start_date
            - origin_stop_id
            - destination_stop_id 

  - name: fct_claimable_journeys
    description: >
        Discovery fact: one row per claimable journey leg (origin->destination on a
        single trip) where the destination arrival is 20+ min late or cancelled.
        Derived from fct_departures via filter-before-join; incremental, delete+insert
        on journey_key, ~6h lookback to cover the GTFS-RT settling tail. NOT the same
        as public.claims (filed claims) — this is the detected set a user MAY file on.
    columns:
        - name: journey_key
          description: Surrogate key; hash of (trip_id, start_date, origin_stop, destination_stop).
          data_tests:
            - not_null
            - unique
    data_tests:
        - dbt_utils.unique_combination_of_columns:
            arguments:
              combination_of_columns:
                - trip__trip_id
                - trip__start_date
                - origin_stop_id
                - destination_stop_id

  - name: fct_journeys
    description: >
        THE unified journey fact the frontend reads (via public.v_journeys). Pairs
        int_stop_events (TV Swedish stops + REST Danish stops) into O-D journeys:
        an origin DEPARTURE joined to a later ARRIVAL of the same service_number
        within a 12h window (handles cross-midnight; excludes next-day recurrence).
        Mode-agnostic column contract (service_number, transport_mode, line_name);
        trains only for now. origin_source/destination_source say which feed supplied
        each leg. Destination delay drives is_claimable (20+ min or cancelled).
    columns:
        - name: journey_key
          description: Surrogate key; hash of (service_number, origin_local_date, origin_stop, destination_stop).
          data_tests:
            - not_null
            - unique
        - name: is_claimable
          description: True if destination delay >= 20 min OR service cancelled.
          data_tests: [not_null]
        - name: origin_stop_id
          data_tests: [not_null]
        - name: destination_stop_id
          data_tests: [not_null]
    data_tests:
        - dbt_utils.unique_combination_of_columns:
            arguments:
              combination_of_columns:
                - service_number
                - origin_local_date
                - origin_stop_id
                - destination_stop_id