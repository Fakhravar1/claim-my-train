version: 2

models:
  - name: int_stop_events
    description: >
        Conformed stop-event substrate (incremental table): disjoint union of TV
        Swedish stops + REST Danish stops on one mode-agnostic vocabulary. The
        linear layer fct_journeys (view) pairs into journeys. Grain violations
        here corrupt journey pairing downstream.
    columns:
        - name: stop_event_key
          description: Surrogate key; hash of (service_number, station_id, event_type, service_date). Incremental unique_key.
          data_tests:
            - not_null
            - unique
        - name: event_type
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: ['arrival', 'departure']
    data_tests:
        - dbt_utils.unique_combination_of_columns:
            arguments:
              combination_of_columns:
                - service_number
                - station_id
                - event_type
                - service_date
